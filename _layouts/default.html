<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <canvas id="equationCanvas"></canvas>
  <div class="content-wrapper">
    {{ content }}
  </div>
  <script>
    const canvas = document.getElementById('equationCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    const equations = [
      'a² + b² = c²',
      'log(xy) = log x + log y',
      'df/dt = lim (f(t+h)-f(t))/h',
      'F = G(m₁m₂)/d²',
      'i² = -1',
      'F - E + V = 2',
      'Φ(x) = (1/√(2πσ²))e^-(x-μ)²/2σ²',
      '∂²u/∂t² = c² ∂²u/∂x²',
      'f̂(ξ) = ∫ f(x)e^(-2πixξ)dx',
      'ρ(∂v/∂t + v·∇v) = -∇p + ∇·T + f',
      '∇·E = 0', '∇·H = 0',
      '∇×E = -1/c ∂H/∂t',
      '∇×H = 1/c ∂E/∂t',
      'dS ≥ 0', 'E = mc²',
      'iℏ ∂Ψ/∂t = ĤΨ',
      'H = -Σ p(x)log p(x)',
      'xₜ₊₁ = k xₜ(1 - xₜ)',
      '½σ²S² ∂²V/∂S² + rS ∂V/∂S + ∂V/∂t - rV = 0'
    ];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;Polish equation particles and update layout structure
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.opacity = Math.random() * 0.4 + 0.1;
        this.text = equations[Math.floor(Math.random() * equations.length)];
        this.fontSize = Math.floor(Math.random() * 8 + 14);
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < -200 || this.x > width + 200 || this.y < -200 || this.y > height + 200) this.reset();
      }
      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.font = `${this.fontSize}px "Courier New", Courier, monospace`;
        ctx.fillText(this.text, this.x, this.y);
      }
    }

    const particles = Array.from({ length: 50 }, () => new Particle());

    function animate() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <canvas id="equationCanvas"></canvas>
  <div class="content-wrapper">
    {{ content }}
  </div>
  <script>
    const canvas = document.getElementById('equationCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    // High-fidelity LaTeX-style strings for the canvas
    const equations = [
      'a² + b² = c²',
      'log(xy) = log(x) + log(y)',
      'df/dt = lim_{h→0} [f(t+h) - f(t)]/h',
      'F = G(m₁m₂)/r²',
      'i² = -1',
      'F - E + V = 2',
      'P(x) = [1/σ√(2π)] e^-(x-μ)²/2σ²',
      '∂²u/∂t² = c² ∂²u/∂x²',
      'f̂(ξ) = ∫_{-∞}^{∞} f(x) e^{-2πixξ} dx',
      'ρ(∂v/∂t + v·∇v) = -∇p + μ∇²v + f',
      '∇·E = 4πρ', '∇·B = 0',
      '∇×E = -∂B/∂t', '∇×B = μ₀J + μ₀ε₀∂E/∂t',
      'dS ≥ dQ/T', 'E = mc²',
      'iℏ ∂Ψ/∂t = [-ℏ²/2m ∇² + V]Ψ',
      'H = -∑ pᵢ log(pᵢ)',
      'x_{n+1} = r xₙ(1 - xₙ)',
      '∂V/∂t + ½σ²S² ∂²V/∂S² + rS ∂V/∂S - rV = 0'
    ];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.2;
        this.vy = (Math.random() - 0.5) * 0.2;
        this.opacity = 0;
        this.maxOpacity = Math.random() * 0.3 + 0.05;
        this.fadeSpeed = Math.random() * 0.005 + 0.002;
        this.text = equations[Math.floor(Math.random() * equations.length)];
        this.fontSize = Math.floor(Math.random() * 6 + 13);
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.opacity < this.maxOpacity) this.opacity += this.fadeSpeed;
        if (this.x < -300 || this.x > width + 300 || this.y < -300 || this.y > height + 300) this.reset();
      }
      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.font = `${this.fontSize}px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace`;
        ctx.fillText(this.text, this.x, this.y);
      }
    }

    const particles = Array.from({ length: 45 }, () => new Particle());

    function animate() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>

---
layout: default
---
<style>
  .post-header {
    margin-bottom: 2.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    color: #00d4ff;
    text-decoration: none;
    margin-bottom: 1.5rem;
    opacity: 0.8;
    transition: opacity 0.2s;
  }
  .back-link:hover { opacity: 1; }
  .post-title {
    font-size: 2.4rem;
    font-weight: 700;
    line-height: 1.2;
    margin: 0 0 0.75rem;
    background: linear-gradient(135deg, #ffffff 0%, #a0c4ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .post-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.75rem;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.45);
    margin: 0;
  }
  .post-meta .sep { opacity: 0.3; }
  .post-meta .tag {
    background: rgba(0,212,255,0.1);
    color: #00d4ff;
    border: 1px solid rgba(0,212,255,0.2);
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .post-content h2 {
    font-size: 1.4rem;
    font-weight: 600;
    color: #e8e8f0;
    margin: 2.2rem 0 0.8rem;
    padding-left: 12px;
    border-left: 3px solid #00d4ff;
  }
  .post-content h3 {
    font-size: 1.1rem;
    font-weight: 600;
    color: #b0b8d0;
    margin: 1.6rem 0 0.5rem;
  }
  .post-content p {
    line-height: 1.8;
    color: #c8cce0;
    margin: 0 0 1rem;
  }
  .post-content strong { color: #e8e8f0; }
  .post-content a { color: #00d4ff; text-decoration: none; }
  .post-content a:hover { text-decoration: underline; }
  .post-content ul, .post-content ol {
    padding-left: 1.4rem;
    margin: 0.5rem 0 1rem;
  }
  .post-content li {
    line-height: 1.8;
    color: #c8cce0;
    margin-bottom: 0.3rem;
  }
  .post-content hr {
    border: none;
    border-top: 1px solid rgba(255,255,255,0.07);
    margin: 2rem 0;
  }
  .post-content em {
    color: rgba(255,255,255,0.4);
    font-style: italic;
  }
  .post-content blockquote {
    border-left: 3px solid rgba(0,212,255,0.4);
    margin: 1.5rem 0;
    padding: 0.8rem 1.2rem;
    background: rgba(0,212,255,0.04);
    border-radius: 0 8px 8px 0;
    color: #a0aac0;
    font-style: italic;
  }
  .post-footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid rgba(255,255,255,0.07);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .post-footer .back-link { margin: 0; }
</style>

<article class="post">
  <header class="post-header">
    <a href="{{ '/' | relative_url }}" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Back to home
    </a>
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.author %}<span class="sep">|</span><span>{{ page.author }}</span>{% endif %}
      {% if page.categories %}
        {% for cat in page.categories %}
          <span class="tag">{{ cat }}</span>
        {% endfor %}
      {% endif %}
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="{{ '/' | relative_url }}" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Back to home
    </a>
  </footer>
</article>
